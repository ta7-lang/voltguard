                  val good = checks.count { it.ok == true }
                  val total = checks.count { it.ok != null }
                  ht.add(a.text("Оптимально: $good из $total ключевых настроек", 13f, C.SUB), top = 4)
                  hr.add(ht, 0, WRAP, 1f, start = 16)
                  head.add(hr)
                  body.add(head, top = 10)

