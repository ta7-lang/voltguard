                      body.add(a.text("Для профилей нужно разрешение «Изменение системных настроек» — его попросят при первом нажатии.", 12f, C.SUB), top = 8)
                  }

                  // Checklist
                  body.add(a.sectionTitle("Проверка настроек"))
                  val sorted = checks.sortedBy { when (it.ok) { false -> 0; null -> 2; true -> 1 } }
                  for (c in sorted) body.add(checkRow(c), bottom = 10)

                  // Animations
                  body.add(a.sectionTitle("Скорость интерфейса"))
                  val an = a.card()
                  val cur = Booster.animScale(a)
                  an.add(a.text("Сейчас: ${fmt1(cur)}x", 15f, C.TEXT, true))
