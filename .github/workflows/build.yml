          package com.voltguard.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.SweepGradient
          import android.view.View
          import kotlin.math.max
          import kotlin.math.min

          private fun View.px(v: Float) = v * resources.displayMetrics.density

          /** Circular progress ring with gradient, center value and caption. */
          class RingView(ctx: Context) : View(ctx) {
              private var fraction = 0f
              private var c1 = C.MINT
              private var c2 = C.BLUE
              private var center = ""
              private var sub = ""
              var strokeDp = 12f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()

              fun set(f: Float, color1: Int, color2: Int, centerText: String, subText: String) {
                  fraction = f.coerceIn(0f, 1f)
                  c1 = color1; c2 = color2; center = centerText; sub = subText
                  invalidate()
              }

              override fun onDraw(cv: Canvas) {
                  val s = px(strokeDp)
                  val size = min(width, height).toFloat()
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = size / 2f - s / 2f - px(2f)
                  rect.set(cx - r, cy - r, cx + r, cy + r)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = s
                  p.strokeCap = Paint.Cap.ROUND
                  p.shader = null
                  p.color = C.LINE
                  cv.drawArc(rect, 0f, 360f, false, p)
                  if (fraction > 0.001f) {
                      p.shader = SweepGradient(cx, cy, intArrayOf(c1, c2, c1), null)
                      cv.save()
                      cv.rotate(-90f, cx, cy)
                      cv.drawArc(rect, 0f, 360f * fraction, false, p)
                      cv.restore()
                  }
                  p.shader = null
                  p.style = Paint.Style.FILL
                  p.textAlign = Paint.Align.CENTER
                  p.color = C.TEXT
                  p.typeface = BLACK
                  p.textSize = size * (if (center.length > 5) 0.15f else 0.2f)
                  val hasSub = sub.isNotEmpty()
                  cv.drawText(center, cx, cy + p.textSize * (if (hasSub) 0.15f else 0.35f), p)
                  if (hasSub) {
                      p.typeface = BOLD
                      p.color = C.SUB
                      p.textSize = size * 0.085f
                      cv.drawText(sub, cx, cy + size * 0.17f, p)
                  }
              }
          }

          /** Donut with several colored segments. */
          class DonutView(ctx: Context) : View(ctx) {
              private var parts: List<Pair<Float, Int>> = emptyList()
              private var center = ""
              private var sub = ""
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()

              fun set(segments: List<Pair<Float, Int>>, centerText: String, subText: String) {
                  parts = segments; center = centerText; sub = subText; invalidate()
              }

              override fun onDraw(cv: Canvas) {
                  val s = px(14f)
                  val size = min(width, height).toFloat()
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = size / 2f - s / 2f - px(2f)
                  rect.set(cx - r, cy - r, cx + r, cy + r)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = s
                  p.strokeCap = Paint.Cap.BUTT
                  p.color = C.LINE
                  cv.drawArc(rect, 0f, 360f, false, p)
                  val total = parts.sumOf { it.first.toDouble() }.toFloat()
                  if (total > 0f) {
                      var start = -90f
                      for ((v, col) in parts) {
                          val sweep = 360f * v / total
                          if (sweep <= 0f) continue
                          p.color = col
                          cv.drawArc(rect, start, max(0.5f, sweep - 1.5f), false, p)
                          start += sweep
                      }
                  }
                  p.style = Paint.Style.FILL
                  p.textAlign = Paint.Align.CENTER
                  p.color = C.TEXT
                  p.typeface = BLACK
                  p.textSize = size * 0.15f
                  cv.drawText(center, cx, cy + p.textSize * 0.2f, p)
                  p.typeface = BOLD
                  p.color = C.SUB
                  p.textSize = size * 0.08f
                  cv.drawText(sub, cx, cy + size * 0.16f, p)
              }
          }

          /** Thin horizontal progress bar. */
          class MiniBar(ctx: Context) : View(ctx) {
              var fraction = 0f
                  set(v) { field = v.coerceIn(0f, 1f); invalidate() }
              var color = C.MINT
                  set(v) { field = v; invalidate() }
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()

              override fun onDraw(cv: Canvas) {
                  val h = height.toFloat()
                  val rad = h / 2f
                  p.color = C.LINE
                  rect.set(0f, 0f, width.toFloat(), h)
                  cv.drawRoundRect(rect, rad, rad, p)
                  if (fraction > 0f) {
                      p.color = color
                      rect.set(0f, 0f, max(h, width * fraction), h)
                      cv.drawRoundRect(rect, rad, rad, p)
                  }
              }
          }

          /** Time-series line chart with gradient fill, grid and axis labels. */
          class LineChartView(ctx: Context) : View(ctx) {
              private var xs: List<Long> = emptyList()
              private var ys: List<Float> = emptyList()
              private var marks: List<Boolean> = emptyList()
              private var minY = 0f
              private var maxY = 100f
              private var xStart = 0L
              private var xEnd = 1L
              private var color = C.MINT
              private var unit = ""
              var compact = false
              var emptyText = "Недостаточно данных — график наполнится со временем"
              var markColor = 0x2A2EE6A8
              var gapMs = 3 * 3_600_000L

              private val line = Paint(Paint.ANTI_ALIAS_FLAG)
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val grid = Paint(Paint.ANTI_ALIAS_FLAG)
              private val label = Paint(Paint.ANTI_ALIAS_FLAG)

              fun setData(
                  x: List<Long>, y: List<Float>, yMin: Float, yMax: Float,
                  start: Long, end: Long, col: Int, unitStr: String, highlight: List<Boolean> = emptyList()
              ) {
                  xs = x; ys = y; minY = yMin; maxY = if (yMax <= yMin) yMin + 1f else yMax
                  xStart = start; xEnd = if (end <= start) start + 1 else end
                  color = col; unit = unitStr; marks = highlight
                  invalidate()
              }

              override fun onDraw(cv: Canvas) {
                  val left = if (compact) 0f else px(34f)
                  val bottom = if (compact) 0f else px(20f)
                  val top = px(6f)
                  val w = width - left - px(4f)
                  val h = height - bottom - top
                  label.color = C.SUB
                  label.textSize = px(10f)
                  grid.color = C.LINE
                  grid.strokeWidth = px(1f)

                  fun xOf(t: Long) = left + w * ((t - xStart).toFloat() / (xEnd - xStart).toFloat())
                  fun yOf(v: Float) = top + h * (1f - (v - minY) / (maxY - minY))

                  if (!compact) {
                      label.textAlign = Paint.Align.RIGHT
                      for (i in 0..4) {
                          val v = minY + (maxY - minY) * i / 4f
                          val y = yOf(v)
                          cv.drawLine(left, y, left + w, y, grid)
                          val txt = if (maxY - minY >= 10f) "${v.toInt()}$unit" else "${fmt1(v)}$unit"
                          cv.drawText(txt, left - px(4f), y + px(3.5f), label)
                      }
                      label.textAlign = Paint.Align.CENTER
                      val span = xEnd - xStart
                      val pattern = if (span > 36 * 3_600_000L) "dd.MM" else "HH:mm"
                      for (i in 0..4) {
                          val t = xStart + span * i / 4
                          val x = xOf(t)
                          label.textAlign = when (i) {
                              0 -> Paint.Align.LEFT
                              4 -> Paint.Align.RIGHT
                              else -> Paint.Align.CENTER
                          }
                          cv.drawText(fmtTime(t, pattern), x, height - px(4f), label)
                      }
                  }

                  // highlighted intervals (e.g. charging)
                  if (marks.size == xs.size && xs.size > 1) {
                      fill.shader = null
                      fill.color = markColor
                      for (i in 1 until xs.size) {
                          if (marks[i - 1] && marks[i] && xs[i] - xs[i - 1] < gapMs) {
                              cv.drawRect(xOf(xs[i - 1]), top, xOf(xs[i]), top + h, fill)
                          }
                      }
                  }

                  if (xs.size < 2) {
                      label.textAlign = Paint.Align.CENTER
                      label.textSize = px(12f)
                      cv.drawText(emptyText, left + w / 2f, top + h / 2f, label)
                      return
                  }

                  line.style = Paint.Style.STROKE
                  line.strokeWidth = px(if (compact) 2f else 2.4f)
                  line.strokeJoin = Paint.Join.ROUND
                  line.strokeCap = Paint.Cap.ROUND
                  line.color = color
                  fill.color = 0xFFFFFFFF.toInt()
                  fill.shader = LinearGradient(0f, top, 0f, top + h, (color and 0x00FFFFFF) or 0x66000000, color and 0x00FFFFFF, Shader.TileMode.CLAMP)

                  var runStart = 0
                  for (i in 1..xs.size) {
                      val breakHere = i == xs.size || xs[i] - xs[i - 1] > gapMs
                      if (breakHere) {
                          if (i - runStart >= 2) {
                              val path = Path()
                              val area = Path()
                              for (k in runStart until i) {
                                  val x = xOf(xs[k])
                                  val y = yOf(ys[k].coerceIn(minY, maxY))
                                  if (k == runStart) {
                                      path.moveTo(x, y); area.moveTo(x, top + h); area.lineTo(x, y)
                                  } else {
                                      path.lineTo(x, y); area.lineTo(x, y)
                                  }
                              }
                              area.lineTo(xOf(xs[i - 1]), top + h)
                              area.close()
                              cv.drawPath(area, fill)
                              cv.drawPath(path, line)
                          } else {
                              line.style = Paint.Style.FILL
                              cv.drawCircle(xOf(xs[runStart]), yOf(ys[runStart].coerceIn(minY, maxY)), px(2.5f), line)
                              line.style = Paint.Style.STROKE
                          }
                          runStart = i
                      }
                  }
                  fill.shader = null
              }
          }

          /** Vertical bar chart. */
          class BarChartView(ctx: Context) : View(ctx) {
              private var labels: List<String> = emptyList()
              private var values: List<Float> = emptyList()
              private var color = C.BLUE
              private var colorHigh = C.AMBER
              private var fmt: (Float) -> String = { fmt1(it) }
              private var labelEvery = 1
              var emptyText = "Пока нет данных"
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()

              fun setData(l: List<String>, v: List<Float>, col: Int, colHigh: Int, every: Int, f: (Float) -> String) {
                  labels = l; values = v; color = col; colorHigh = colHigh; labelEvery = max(1, every); fmt = f
                  invalidate()
              }

              override fun onDraw(cv: Canvas) {
                  val top = px(16f)
                  val bottom = px(18f)
                  val h = height - top - bottom
                  val n = values.size
                  p.textSize = px(10f)
                  p.textAlign = Paint.Align.CENTER
                  if (n == 0 || values.all { it <= 0f }) {
                      p.color = C.SUB
                      p.textSize = px(12f)
                      cv.drawText(emptyText, width / 2f, height / 2f, p)
                      return
                  }
                  val maxV = values.maxOrNull() ?: 1f
                  val slot = width.toFloat() / n
                  val bw = slot * 0.62f
                  val avg = values.filter { it > 0f }.average().toFloat()
                  values.forEachIndexed { i, v ->
                      val x = slot * i + (slot - bw) / 2f
                      val bh = if (maxV > 0) h * v / maxV else 0f
                      p.color = C.LINE
                      rect.set(x, top, x + bw, top + h)
                      cv.drawRoundRect(rect, bw / 3f, bw / 3f, p)
                      if (bh > 0f) {
                          p.color = if (v > avg * 1.6f) colorHigh else color
                          rect.set(x, top + h - max(bh, px(3f)), x + bw, top + h)
                          cv.drawRoundRect(rect, bw / 3f, bw / 3f, p)
                      }
                      if (v == maxV) {
                          p.color = C.TEXT
                          cv.drawText(fmt(v), x + bw / 2f, top + h - bh - px(4f), p)
                      }
                      if (i % labelEvery == 0 && i < labels.size) {
                          p.color = C.SUB
                          cv.drawText(labels[i], x + bw / 2f, height - px(4f), p)
                      }
                  }
              }
          }
          VG_END_OF_FILE
          mkdir -p app/src/main/java/com/voltguard/app
