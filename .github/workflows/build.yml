          package com.voltguard.app

          import android.content.Intent
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          class BatteryScreen(a: MainActivity) : Screen(a) {
              private lateinit var live: LinearLayout
              private lateinit var charts: LinearLayout
              private val liveValues = HashMap<String, TextView>()
              private var rangeDays = 1
              private val tick = object : Runnable {
                  override fun run() { updateLive(); a.handler.postDelayed(this, 2000) }
              }

              override fun build(): View {
                  val (sv, col) = page("Батарея", "Показатели в реальном времени и история разряда")
                  live = col.add(a.vbox(), top = 8)
                  val keys = listOf(
                      "Уровень", "Состояние", "Ток", "Мощность", "Температура", "Напряжение",
                      "Здоровье", "Циклы зарядки", "Текущий заряд", "Оценка ёмкости", "Технология", "Источник"
                  )
                  val tiles = keys.map { k ->
                      val (tile, v) = a.statTile(k, "—")
                      liveValues[k] = v
                      tile
                  }
                  val card = a.card()
                  card.add(a.text("Сейчас · обновляется каждые 2 с", 12f, C.SUB), bottom = 10)
                  card.add(a.grid(tiles, 2))
                  live.add(card)
                  charts = col.add(a.vbox())
                  return sv
              }

              override fun onShow() {
                  updateLive()
                  a.handler.removeCallbacks(tick)
                  a.handler.postDelayed(tick, 2000)
                  renderCharts()
              }

              override fun onHide() { a.handler.removeCallbacks(tick) }

              private fun set(k: String, v: String, color: Int = C.TEXT) {
                  liveValues[k]?.apply { text = v; setTextColor(color) }
              }

              private fun updateLive() {
                  val b = Battery.read(a)
                  set("Уровень", "${fmt1(b.pct)} %", if (b.pct <= 20) C.RED else C.MINT)
                  set("Состояние", if (b.charging) "Заряжается" else "Разряжается", if (b.charging) C.MINT else C.TEXT)
                  set("Ток", "${abs(b.currentMa)} мА", if (b.charging) C.MINT else C.AMBER)
                  set("Мощность", "${fmt2(b.powerW)} Вт")
                  set("Температура", "${fmt1(b.tempC)} °C", when { b.tempC >= 42 -> C.RED; b.tempC >= 37 -> C.AMBER; else -> C.TEXT })
                  set("Напряжение", "${fmt2(b.voltageMv / 1000f)} В")
                  set("Здоровье", b.healthText, if (b.health == android.os.BatteryManager.BATTERY_HEALTH_GOOD) C.MINT else C.AMBER)
                  set("Циклы зарядки", if (b.cycleCount >= 0) "${b.cycleCount}" else "н/д")
                  set("Текущий заряд", if (b.chargeMah > 0) "${b.chargeMah} мА·ч" else "н/д")
                  val cap = b.estCapacityMah
                  set(
                      "Оценка ёмкости",
                      if (cap > 0) "$cap мА·ч (${min(100, cap * 100 / Battery.DESIGN_MAH)}%)" else "н/д",
                      if (cap > 0 && cap * 100 / Battery.DESIGN_MAH < 80) C.AMBER else C.TEXT
                  )
                  set("Технология", b.technology)
                  set("Источник", b.plugText)
              }

              private fun renderCharts() {
                  val days = rangeDays
                  bg({
                      val now = System.currentTimeMillis()
                      Triple(now, History.load(a, now - days * 24 * 3_600_000L), History.load(a, now - 24 * 3_600_000L))
                  }) { (now, hist, day) -> fill(now, hist, day) }
              }

              private fun fill(now: Long, hist: List<Sample>, day: List<Sample>) {
                  charts.removeAllViews()
                  val d = Analysis.drain(hist)
                  val b = Battery.read(a)

                  // Range chips
                  val chips = a.hbox()
                  listOf(1 to "24 часа", 3 to "3 дня", 7 to "7 дней", 14 to "14 дней").forEach { (n, label) ->
                      chips.add(a.chip(label, n == rangeDays) { rangeDays = n; renderCharts() }, WRAP, WRAP, end = 8)
                  }
                  charts.add(chips, top = 16)

                  // Level chart
                  charts.add(a.sectionTitle("Уровень заряда"))
                  val lc = a.card()
                  val level = LineChartView(a)
                  level.setData(hist.map { it.t }, hist.map { it.pct }, 0f, 100f, now - rangeDays * 24 * 3_600_000L, now, C.MINT, "%", hist.map { it.charging })
                  lc.add(level, MATCH, a.dp(190))
                  lc.add(a.text("Зелёным фоном отмечены периоды зарядки", 11.5f, C.SUB), top = 6)
                  charts.add(lc)

                  // Drain analysis
                  charts.add(a.sectionTitle("Анализ разряда"))
                  val dc = a.card()
                  val (verdict, vcol) = Analysis.idleVerdict(d.idleRate)
                  val hoursLeft = Analysis.hoursLeft(b, d)
                  val idleLeft = d.idleRate?.takeIf { it > 0.01f }?.let { b.pct / it }
                  val tiles = listOf(
                      a.statTile("В покое", d.idleRate?.let { "${fmt2(it)} %/ч" } ?: "—", vcol).first,
                      a.statTile("Экран включён", d.activeRate?.let { "${fmt1(it)} %/ч" } ?: "—", C.CYAN).first,
                      a.statTile("Средний разряд", d.overallRate?.let { "${fmt2(it)} %/ч" } ?: "—").first,
                      a.statTile("Осталось (оценка)", hoursLeft?.let { fmtHours(it) } ?: "—", C.MINT).first,
                      a.statTile("В покое хватит на", idleLeft?.let { fmtHours(it) } ?: "—", C.VIOLET).first,
                      a.statTile("Время наблюдения", fmtHours(d.idleHours + d.activeHours)).first
                  )
                  dc.add(a.grid(tiles, 2))
                  dc.add(a.text("Разряд в покое: $verdict", 14f, vcol, true), top = 12)
                  val tip = when {
                      d.idleRate == null -> "Оставьте телефон с выключенным экраном хотя бы на 30–60 минут — VoltGuard измерит расход в покое."
                      d.idleRate < 0.6f -> "Телефон почти не тратит энергию с выключенным экраном. Так и должно быть."
                      d.idleRate < 1.2f -> "Нормальный расход в покое. Улучшить можно, ограничив фоновые приложения."
                      else -> "Что-то мешает телефону «засыпать». Проверьте приложения с долгой фоновой работой и без ограничений батареи."
                  }
                  dc.add(a.text(tip, 12.5f, C.SUB), top = 4)
                  if ((d.idleRate ?: 0f) >= 1.2f) {
                      dc.add(a.pill("Найти виновников", C.AMBER) { a.showApps(1) }, WRAP, WRAP, top = 10)
                  }
                  charts.add(dc)

                  // Hourly drain
                  charts.add(a.sectionTitle("Расход по часам (24 ч)"))
                  val hc = a.card()
                  val (labels, vals) = Analysis.hourly(day, now)
                  val bars = BarChartView(a)
                  bars.setData(labels, vals, C.BLUE, C.AMBER, 4) { "${fmt1(it)}%" }
                  hc.add(bars, MATCH, a.dp(150))
                  hc.add(a.text("Оранжевым выделены часы с повышенным расходом", 11.5f, C.SUB), top = 6)
                  charts.add(hc)

                  // Temperature
                  charts.add(a.sectionTitle("Температура"))
                  val tc = a.card()
                  val temps = hist.map { it.temp }
                  val tMin = (temps.minOrNull() ?: 20f).let { max(0f, it - 3f) }
                  val tMax = (temps.maxOrNull() ?: 40f) + 3f
                  val tchart = LineChartView(a)
                  tchart.setData(hist.map { it.t }, temps, tMin, tMax, now - rangeDays * 24 * 3_600_000L, now, C.AMBER, "°")
                  tc.add(tchart, MATCH, a.dp(150))
                  val avgT = if (temps.isEmpty()) null else temps.average().toFloat()
                  tc.add(a.text(
                      "Средняя ${avgT?.let { fmt1(it) } ?: "—"} °C · максимум ${temps.maxOrNull()?.let { fmt1(it) } ?: "—"} °C. " +
                          "Нагрев выше 40 °C ускоряет износ аккумулятора.", 12f, C.SUB), top = 6)
                  charts.add(tc)

                  // Tips for battery longevity
                  charts.add(a.sectionTitle("Здоровье аккумулятора"))
                  val hcard = a.card()
                  val tipsList = listOf(
                      "Держите заряд в диапазоне 20–80% — это сильнее всего продлевает срок службы.",
                      "Включите «Оптимизированную зарядку» в настройках батареи HyperOS.",
                      "Не заряжайте телефон под подушкой и во время игр — нагрев вредит ячейкам.",
                      "Быструю зарядку 67 Вт+ используйте, когда спешите; ночью лучше обычная."
                  )
                  tipsList.forEach { hcard.add(a.text("•  $it", 13f, C.TEXT), bottom = 6) }
                  hcard.add(a.pill("Настройки батареи HyperOS", C.MINT, filled = false) { Checks.xiaomiBattery(a) }, WRAP, WRAP, top = 6)
                  hcard.add(a.pill("Статистика расхода Android", C.BLUE, filled = false) {
                      a.openFirst(Intent(Intent.ACTION_POWER_USAGE_SUMMARY))
                  }, WRAP, WRAP, top = 8)
                  charts.add(hcard)

                  charts.add(a.pill("Сбросить историю замеров", C.RED, filled = false) {
                      History.clear(a); a.toast("История очищена"); renderCharts()
                  }, WRAP, WRAP, top = 16)
              }
          }
