name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create VoltGuard project files
        run: |
          mkdir -p proj && cd proj
          cat > README.md <<'VG_END_OF_FILE'
          # VoltGuard — экономия батареи, очистка и мониторинг для Xiaomi 15T

          Нативное Android-приложение (Kotlin, без сторонних библиотек), minSdk 30, targetSdk 35.

          ## Возможности
          - **Обзор** — заряд, оставшееся время, оценка оптимизации 0–100, быстрые действия, ОЗУ и хранилище, разряд за 24 ч.
          - **Батарея** — 12 живых показателей (ток, мощность, температура, напряжение, циклы, оценка ёмкости), графики уровня и температуры за 1–14 дней, расход по часам, анализ разряда в покое и при включённом экране.
          - **Экономия** — проверка 16 настроек с исправлением в одно касание, профили «Макс. экономия» / «Сбалансированный», скорость анимаций, переходы в фирменные настройки HyperOS (батарея, автозапуск).
          - **Очистка** — системная очистка кэша всех приложений; глубокое сканирование: временные файлы, логи, миниатюры, пустые папки, остатки удалённых приложений, APK, дубликаты (MD5), большие и старые файлы.
          - **Приложения** — экранное время, фоновая работа (главная причина разряда в покое), приложения без ограничений батареи, неиспользуемые 30+ дней.

          Замеры батареи — раз в 15 минут через системный JobScheduler, без постоянного фонового сервиса.

          ## Сборка
          - **Android Studio**: File → Open → папка проекта → Build → Build APK(s).
          - **GitHub Actions**: workflow `.github/workflows/build.yml` собирает APK и публикует его в Releases.
          VG_END_OF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'VG_END_OF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.voltguard.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.voltguard.app"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
          }
          VG_END_OF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'VG_END_OF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS"
                  tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"
                  tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.READ_SYNC_SETTINGS" />
              <uses-permission android:name="android.permission.WRITE_SYNC_SETTINGS" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />

              <application
