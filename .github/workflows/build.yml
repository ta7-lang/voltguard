          package com.voltguard.app

          import android.app.ActivityManager
          import android.app.AppOpsManager
          import android.app.usage.UsageStatsManager
          import android.content.ComponentName
          import android.content.ContentResolver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.graphics.drawable.Drawable
          import android.location.LocationManager
          import android.net.Uri
          import android.nfc.NfcAdapter
          import android.os.PowerManager
          import android.os.Process
          import android.provider.Settings

          /** Opens the first intent that resolves. Returns true on success. */
          fun Context.openFirst(vararg intents: Intent): Boolean {
              for (i in intents) {
                  try {
                      if (this !is android.app.Activity) i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                      return true
                  } catch (e: Throwable) {
                      // try next
                  }
              }
              toast("Не удалось открыть настройки на этом устройстве")
              return false
          }

          fun comp(pkg: String, cls: String): Intent = Intent().setComponent(ComponentName(pkg, cls))

          fun Context.appDetails(pkg: String) =
              openFirst(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$pkg")))

          object Perms {
              fun usage(ctx: Context): Boolean {
                  val ops = ctx.getSystemService(AppOpsManager::class.java) ?: return false
                  val mode = ops.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), ctx.packageName)
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              fun storage(): Boolean = Cleaner.hasAccess()
              fun writeSettings(ctx: Context): Boolean = Settings.System.canWrite(ctx)
              fun secure(ctx: Context): Boolean =
                  ctx.checkSelfPermission("android.permission.WRITE_SECURE_SETTINGS") == PackageManager.PERMISSION_GRANTED

              fun requestUsage(ctx: Context) = ctx.openFirst(
                  Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS, Uri.parse("package:${ctx.packageName}")),
                  Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)
              )

              fun requestStorage(ctx: Context) = ctx.openFirst(
                  Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:${ctx.packageName}")),
                  Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
              )

              fun requestWrite(ctx: Context) = ctx.openFirst(
                  Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:${ctx.packageName}"))
              )

              fun adbCommand(ctx: Context) = "adb shell pm grant ${ctx.packageName} android.permission.WRITE_SECURE_SETTINGS"
          }

          object Booster {
              fun mem(ctx: Context): ActivityManager.MemoryInfo {
                  val am = ctx.getSystemService(ActivityManager::class.java)
                  val mi = ActivityManager.MemoryInfo()
                  am?.getMemoryInfo(mi)
                  return mi
              }

              /** Asks the system to stop cached background processes of user apps. Returns number of apps processed. */
              fun boost(ctx: Context): Int {
                  val am = ctx.getSystemService(ActivityManager::class.java) ?: return 0
                  val pm = ctx.packageManager
                  var n = 0
                  for (app in pm.getInstalledApplications(0)) {
                      if (app.packageName == ctx.packageName) continue
                      if ((app.flags and ApplicationInfo.FLAG_SYSTEM) != 0) continue
                      try { am.killBackgroundProcesses(app.packageName); n++ } catch (e: Throwable) { }
                  }
                  System.gc()
                  return n
              }

              fun animScale(ctx: Context): Float =
                  Settings.Global.getFloat(ctx.contentResolver, Settings.Global.ANIMATOR_DURATION_SCALE, 1f)

              fun setAnimScale(ctx: Context, v: Float): Boolean = try {
                  val cr = ctx.contentResolver
                  Settings.Global.putFloat(cr, Settings.Global.ANIMATOR_DURATION_SCALE, v)
                  Settings.Global.putFloat(cr, Settings.Global.TRANSITION_ANIMATION_SCALE, v)
                  Settings.Global.putFloat(cr, Settings.Global.WINDOW_ANIMATION_SCALE, v)
                  true
              } catch (e: Throwable) { false }
          }

          class AppStat(
              val pkg: String,
              val label: String,
              val icon: Drawable?,
              val system: Boolean,
              val fg: Long,
              val fgs: Long,
              val lastUsed: Long,
              val unrestricted: Boolean,
              val installed: Long
          )

          object Apps {
              fun load(ctx: Context, days: Int): List<AppStat> {
                  val pm = ctx.packageManager
                  val power = ctx.getSystemService(PowerManager::class.java)
                  val now = System.currentTimeMillis()
                  val stats = if (Perms.usage(ctx)) {
                      val usm = ctx.getSystemService(UsageStatsManager::class.java)
                      usm?.queryAndAggregateUsageStats(now - days * 24L * 3_600_000L, now) ?: emptyMap()
                  } else emptyMap()
                  val out = ArrayList<AppStat>()
                  for (app in pm.getInstalledApplications(0)) {
                      val pkg = app.packageName
                      if (pkg == ctx.packageName) continue
                      val system = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                      val u = stats[pkg]
                      val fg = u?.totalTimeInForeground ?: 0L
                      val fgs = u?.totalTimeForegroundServiceUsed ?: 0L
                      if (system && fg == 0L && fgs == 0L) continue
                      val launchable = pm.getLaunchIntentForPackage(pkg) != null
                      if (system && !launchable && fgs < 60_000L) continue
                      val installed = try { pm.getPackageInfo(pkg, 0).firstInstallTime } catch (e: Throwable) { 0L }
                      out.add(
                          AppStat(
                              pkg,
                              try { pm.getApplicationLabel(app).toString() } catch (e: Throwable) { pkg },
                              try { pm.getApplicationIcon(app) } catch (e: Throwable) { null },
                              system, fg, fgs, u?.lastTimeUsed ?: 0L,
                              power?.isIgnoringBatteryOptimizations(pkg) ?: false,
                              installed
                          )
                      )
                  }
                  return out
              }

              fun unrestrictedCount(ctx: Context): Int {
                  val pm = ctx.packageManager
                  val power = ctx.getSystemService(PowerManager::class.java) ?: return 0
                  return pm.getInstalledApplications(0).count {
                      (it.flags and ApplicationInfo.FLAG_SYSTEM) == 0 && it.packageName != ctx.packageName &&
                          power.isIgnoringBatteryOptimizations(it.packageName)
                  }
              }
          }

          /** One energy-saving check. ok = null means informational (not scored). */
          class Check(
              val title: String,
              val desc: String,
              val ok: Boolean?,
              val state: String,
              val actionLabel: String?,
              val action: (() -> Unit)?
          )

          object Checks {
              fun xiaomiBattery(ctx: Context) = ctx.openFirst(
                  comp("com.miui.securitycenter", "com.miui.powercenter.PowerSettings"),
                  Intent("miui.intent.action.POWER_MANAGER"),
                  Intent(Intent.ACTION_POWER_USAGE_SUMMARY)
              )

              fun xiaomiAutostart(ctx: Context) = ctx.openFirst(
                  comp("com.miui.securitycenter", "com.miui.permcenter.autostart.AutoStartManagementActivity"),
                  Intent("miui.intent.action.OP_AUTO_START"),
                  Intent(Settings.ACTION_APPLICATION_SETTINGS)
              )

              fun batterySaver(ctx: Context) = ctx.openFirst(
                  Intent(Settings.ACTION_BATTERY_SAVER_SETTINGS),
                  Intent(Intent.ACTION_POWER_USAGE_SUMMARY)
              )

              private fun gInt(cr: ContentResolver, key: String, def: Int) =
                  try { Settings.Global.getInt(cr, key, def) } catch (e: Throwable) { def }

              private fun sInt(cr: ContentResolver, key: String, def: Int) =
                  try { Settings.System.getInt(cr, key, def) } catch (e: Throwable) { def }

              fun all(a: MainActivity, unrestricted: Int): List<Check> {
                  val cr = a.contentResolver
                  val pm = a.getSystemService(PowerManager::class.java)
                  val canWrite = Perms.writeSettings(a)
                  val list = ArrayList<Check>()

                  val saver = pm?.isPowerSaveMode ?: false
                  list += Check(
                      "Режим энергосбережения", "Ограничивает фоновую активность, синхронизацию и визуальные эффекты.",
                      saver, if (saver) "Включён" else "Выключен", "Открыть", { batterySaver(a) }
                  )

                  val night = (a.resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                  list += Check(
                      "Тёмная тема", "На AMOLED-экране Xiaomi 15T тёмные пиксели почти не потребляют энергию.",
                      night, if (night) "Включена" else "Выключена", "Открыть",
                      { a.openFirst(Intent(Settings.ACTION_DISPLAY_SETTINGS)) }
                  )

                  val autoBright = sInt(cr, Settings.System.SCREEN_BRIGHTNESS_MODE, 0) == Settings.System.SCREEN_BRIGHTNESS_MODE_AUTOMATIC
                  list += Check(
                      "Автояркость", "Экран — главный потребитель энергии. Автояркость не держит его ярче, чем нужно.",
                      autoBright, if (autoBright) "Включена" else "Выключена",
                      if (autoBright) null else "Включить",
                      if (autoBright) null else ({
                          if (canWrite) {
                              Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_AUTOMATIC)
                              a.refresh()
                          } else Perms.requestWrite(a)
                      })
                  )

                  val timeout = sInt(cr, Settings.System.SCREEN_OFF_TIMEOUT, 60000)
                  list += Check(
                      "Тайм-аут экрана", "Чем быстрее гаснет экран, тем меньше напрасного расхода. Оптимально — 30 секунд.",
                      timeout <= 30000, fmtDuration(timeout.toLong()).let { if (timeout < 60000) "${timeout / 1000} с" else it },
                      if (timeout <= 30000) null else "Сделать 30 с",
                      if (timeout <= 30000) null else ({
                          if (canWrite) {
                              Settings.System.putInt(cr, Settings.System.SCREEN_OFF_TIMEOUT, 30000)
                              a.refresh()
                          } else Perms.requestWrite(a)
                      })
                  )

                  val sync = ContentResolver.getMasterSyncAutomatically()
                  list += Check(
                      "Автосинхронизация аккаунтов", "Постоянные пробуждения для синхронизации — частая причина разряда в покое. Почта и мессенджеры с push продолжат работать.",
                      !sync, if (sync) "Включена" else "Выключена",
                      if (sync) "Выключить" else "Включить",
                      {
                          ContentResolver.setMasterSyncAutomatically(!sync)
                          a.refresh()
                      }
                  )

                  val wifiScan = gInt(cr, "wifi_scan_always_enabled", 0) == 1
                  val bleScan = gInt(cr, "ble_scan_always_enabled", 0) == 1
                  list += Check(
                      "Фоновый поиск Wi-Fi и Bluetooth", "Телефон сканирует сети даже при выключенных Wi-Fi/Bluetooth ради точности геолокации. Отключение снижает расход в покое.",
                      !(wifiScan || bleScan),
                      when {
                          wifiScan && bleScan -> "Wi-Fi и BT сканируют"
                          wifiScan -> "Wi-Fi сканирует"
                          bleScan -> "Bluetooth сканирует"
                          else -> "Выключен"
                      },
                      "Открыть",
                      {
                          a.openFirst(
                              Intent("android.settings.LOCATION_SCANNING_SETTINGS"),
                              Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)
                          )
                      }
                  )

                  val anim = Booster.animScale(a)
                  list += Check(
                      "Анимации интерфейса", "Ускоренные анимации (0.5x) делают систему отзывчивее и немного снижают нагрузку на GPU.",
                      anim <= 0.5f, "${fmt1(anim)}x", if (anim <= 0.5f) null else "Ускорить",
                      if (anim <= 0.5f) null else ({ a.speedUpAnimations() })
                  )

                  list += Check(
                      "Приложения без ограничений батареи", "Им разрешено работать в фоне без ограничений — это главный источник разряда в режиме покоя.",
                      unrestricted <= 3, "$unrestricted шт.", "Показать", { a.showApps(2) }
                  )

                  val loc = a.getSystemService(LocationManager::class.java)?.isLocationEnabled ?: false
                  list += Check(
                      "Геолокация", "Выключайте, когда не пользуетесь навигацией — приложения перестанут запрашивать GPS в фоне.",
                      null, if (loc) "Включена" else "Выключена", "Открыть",
                      { a.openFirst(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)) }
                  )

                  val bt = gInt(cr, Settings.Global.BLUETOOTH_ON, 0) == 1
                  list += Check(
                      "Bluetooth", "Если нет подключённых часов или наушников — выключите.",
                      null, if (bt) "Включён" else "Выключен", "Открыть",
                      { a.openFirst(Intent(Settings.ACTION_BLUETOOTH_SETTINGS)) }
                  )

                  val nfc = try { NfcAdapter.getDefaultAdapter(a)?.isEnabled ?: false } catch (e: Throwable) { false }
                  list += Check(
                      "NFC", "Расход небольшой, но если не платите телефоном — можно отключить.",
                      null, if (nfc) "Включён" else "Выключен", "Открыть",
                      { a.openFirst(Intent(Settings.ACTION_NFC_SETTINGS), Intent(Settings.ACTION_WIRELESS_SETTINGS)) }
                  )

                  val hz = try { a.display?.refreshRate ?: 60f } catch (e: Throwable) { 60f }
                  list += Check(
                      "Частота обновления экрана", "Настройки → Дисплей → Частота обновления. «Стандартная» (60 Гц) заметно экономнее, чем 120/144 Гц.",
                      null, "Сейчас ${hz.toInt()} Гц", "Открыть",
                      { a.openFirst(Intent(Settings.ACTION_DISPLAY_SETTINGS)) }
                  )

                  list += Check(
                      "5G и мобильная сеть", "При слабом сигнале 5G расходует заметно больше. Выберите «Предпочтительно 4G» в настройках SIM.",
                      null, "Рекомендация", "Открыть",
                      {
                          a.openFirst(
                              Intent(Settings.ACTION_NETWORK_OPERATOR_SETTINGS),
                              Intent(Settings.ACTION_DATA_ROAMING_SETTINGS),
                              Intent(Settings.ACTION_WIRELESS_SETTINGS)
                          )
                      }
                  )

                  list += Check(
                      "Always-On Display", "Постоянно включённый экран блокировки расходует батарею в покое. Отключите или включите режим «по касанию».",
                      null, "Рекомендация", "Открыть",
                      { a.openFirst(comp("com.miui.aod", "com.miui.aod.settings.AODSettingsActivity"), Intent(Settings.ACTION_DISPLAY_SETTINGS)) }
                  )

                  list += Check(
                      "Батарея HyperOS", "Фирменные режимы Xiaomi: «Ультра экономия», оптимизация зарядки, контроль фоновой активности приложений.",
                      null, "Xiaomi", "Открыть", { xiaomiBattery(a) }
                  )

                  list += Check(
                      "Автозапуск приложений", "Запретите автозапуск всем приложениям, которым не нужно получать уведомления.",
                      null, "Xiaomi", "Открыть", { xiaomiAutostart(a) }
                  )
                  return list
              }

              fun score(list: List<Check>): Int {
                  val scored = list.filter { it.ok != null }
                  if (scored.isEmpty()) return 0
                  return scored.count { it.ok == true } * 100 / scored.size
              }

              /** Applies a power profile. Returns description of what was changed. */
              fun applyProfile(a: MainActivity, max: Boolean): String {
                  if (!Perms.writeSettings(a)) {
                      Perms.requestWrite(a)
                      return "Разрешите «Изменение системных настроек» и повторите"
                  }
                  val cr = a.contentResolver
                  val done = ArrayList<String>()
                  try {
                      Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_AUTOMATIC)
                      done += "автояркость"
                  } catch (e: Throwable) { }
                  try {
                      Settings.System.putInt(cr, Settings.System.SCREEN_OFF_TIMEOUT, if (max) 15000 else 60000)
                      done += if (max) "тайм-аут 15 с" else "тайм-аут 1 мин"
                  } catch (e: Throwable) { }
                  try {
                      Settings.System.putInt(cr, Settings.System.HAPTIC_FEEDBACK_ENABLED, if (max) 0 else 1)
                      done += if (max) "вибро-отклик выкл." else "вибро-отклик вкл."
                  } catch (e: Throwable) { }
                  try {
                      ContentResolver.setMasterSyncAutomatically(!max)
                      done += if (max) "синхронизация выкл." else "синхронизация вкл."
                  } catch (e: Throwable) { }
                  if (Perms.secure(a)) {
                      Booster.setAnimScale(a, if (max) 0.5f else 1f)
                      done += if (max) "анимации 0.5x" else "анимации 1x"
                  }
                  return "Применено: " + done.joinToString(", ")
              }
          }
          VG_END_OF_FILE
          mkdir -p app/src/main/java/com/voltguard/app
          cat > app/src/main/java/com/voltguard/app/Ui.kt <<'VG_END_OF_FILE'
          package com.voltguard.app

          import android.content.Context
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors

          object C {
              val BG = 0xFF0A0E17.toInt()
              val NAV = 0xFF0F1420.toInt()
              val CARD = 0xFF141A28.toInt()
              val CARD2 = 0xFF1B2335.toInt()
              val LINE = 0xFF263049.toInt()
              val TEXT = 0xFFEEF2FF.toInt()
              val SUB = 0xFF8B95AE.toInt()
              val MINT = 0xFF2EE6A8.toInt()
              val BLUE = 0xFF4D8DFF.toInt()
              val VIOLET = 0xFF9B6BFF.toInt()
              val AMBER = 0xFFFFB648.toInt()
              val RED = 0xFFFF5A76.toInt()
              val CYAN = 0xFF2BD4F5.toInt()
          }

          const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
          const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

          private val pool = Executors.newFixedThreadPool(3)
          private val mainHandler = Handler(Looper.getMainLooper())

          /** Run [work] on a background thread and deliver the result on the UI thread. */
          fun <T> bg(work: () -> T, done: (T) -> Unit) {
              pool.execute {
                  val r = runCatching(work)
                  mainHandler.post {
                      r.onSuccess { done(it) }
                      r.onFailure { it.printStackTrace() }
                  }
              }
          }

          fun bgRun(work: () -> Unit) {
              pool.execute { runCatching(work) }
          }

          fun Context.dp(v: Float): Int = (v * resources.displayMetrics.density + 0.5f).toInt()
          fun Context.dp(v: Int): Int = dp(v.toFloat())

          val BOLD: Typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
          val BLACK: Typeface = Typeface.create("sans-serif-black", Typeface.NORMAL)

          fun Context.text(
              s: CharSequence,
              sp: Float = 14f,
              color: Int = C.TEXT,
              bold: Boolean = false
          ): TextView = TextView(this).apply {
              text = s
              textSize = sp
              setTextColor(color)
              if (bold) typeface = BOLD
              setLineSpacing(0f, 1.12f)
          }

          fun Context.vbox(): LinearLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

          fun Context.hbox(): LinearLayout = LinearLayout(this).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = Gravity.CENTER_VERTICAL
          }

          fun Context.rounded(color: Int, radiusDp: Float = 20f, stroke: Int = 0): GradientDrawable =
              GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(radiusDp).toFloat()
                  if (stroke != 0) setStroke(dp(1), stroke)
              }

          fun Context.gradient(c1: Int, c2: Int, radiusDp: Float = 20f): GradientDrawable =
              GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(c1, c2)).apply {
                  cornerRadius = dp(radiusDp).toFloat()
              }

          fun Context.card(color: Int = C.CARD): LinearLayout = vbox().apply {
              background = rounded(color, 22f)
              setPadding(dp(16), dp(16), dp(16), dp(16))
          }

          /** Adds [v] to this LinearLayout with sizes in px (MATCH/WRAP allowed) and margins in dp. */
          fun <V : View> LinearLayout.add(
              v: V,
              w: Int = MATCH,
              h: Int = WRAP,
              weight: Float = 0f,
              top: Int = 0,
              bottom: Int = 0,
              start: Int = 0,
              end: Int = 0
          ): V {
              val lp = LinearLayout.LayoutParams(w, h, weight)
              val c = context
              lp.setMargins(c.dp(start), c.dp(top), c.dp(end), c.dp(bottom))
              addView(v, lp)
              return v
          }

          fun Context.pill(label: String, color: Int = C.MINT, filled: Boolean = true, onClick: () -> Unit): TextView =
              text(label, 14f, if (filled) 0xFF06121A.toInt() else color, true).apply {
                  gravity = Gravity.CENTER
                  setPadding(dp(16), dp(11), dp(16), dp(11))
                  background = if (filled) rounded(color, 14f) else rounded(0x00000000, 14f, color)
                  isClickable = true
                  isFocusable = true
                  setOnClickListener { onClick() }
              }

          fun Context.chip(label: String, active: Boolean, onClick: () -> Unit): TextView =
              text(label, 13f, if (active) 0xFF06121A.toInt() else C.SUB, true).apply {
                  gravity = Gravity.CENTER
                  setPadding(dp(14), dp(8), dp(14), dp(8))
                  background = if (active) rounded(C.MINT, 12f) else rounded(C.CARD2, 12f)
                  setOnClickListener { onClick() }
              }

          fun Context.sectionTitle(s: String): TextView = text(s, 18f, C.TEXT, true).apply {
              setPadding(dp(4), dp(18), 0, dp(8))
          }

          /** A small tile: label on top, big value under it. Returns the tile and the value TextView. */
          fun Context.statTile(label: String, value: String, accent: Int = C.TEXT): Pair<LinearLayout, TextView> {
              val box = vbox().apply {
                  background = rounded(C.CARD2, 16f)
                  setPadding(dp(12), dp(10), dp(12), dp(12))
              }
              box.add(text(label, 12f, C.SUB))
              val v = box.add(text(value, 18f, accent, true), top = 2)
              return box to v
          }

          /** Grid of tiles, [cols] per row. */
          fun Context.grid(tiles: List<View>, cols: Int = 2): LinearLayout {
              val out = vbox()
              tiles.chunked(cols).forEachIndexed { idx, row ->
                  val r = hbox()
                  row.forEachIndexed { i, t ->
                      r.add(t, 0, WRAP, 1f, start = if (i == 0) 0 else 5, end = if (i == row.size - 1) 0 else 5)
                  }
                  for (k in row.size until cols) r.add(View(this), 0, 1, 1f, start = 5)
                  out.add(r, top = if (idx == 0) 0 else 10)
              }
              return out
          }

          fun Context.toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

          fun fmtBytes(b: Long): String {
              val v = b.toDouble()
              return when {
                  b < 1024 -> "$b Б"
                  v < 1024.0 * 1024 -> String.format(Locale.US, "%.0f КБ", v / 1024)
                  v < 1024.0 * 1024 * 1024 -> String.format(Locale.US, "%.1f МБ", v / 1024 / 1024)
                  else -> String.format(Locale.US, "%.2f ГБ", v / 1024 / 1024 / 1024)
              }
          }

          fun fmtDuration(ms: Long): String {
              if (ms <= 0) return "0 мин"
              val totalMin = ms / 60000
              val d = totalMin / (60 * 24)
              val h = (totalMin / 60) % 24
              val m = totalMin % 60
              return when {
                  d > 0 -> "$d д $h ч"
                  h > 0 -> "$h ч $m мин"
                  else -> "$m мин"
              }
          }

          fun fmtHours(h: Float): String = fmtDuration((h * 3_600_000).toLong())

          fun fmt1(v: Float): String = String.format(Locale.US, "%.1f", v)
          fun fmt2(v: Float): String = String.format(Locale.US, "%.2f", v)

          fun fmtTime(t: Long, pattern: String = "HH:mm"): String =
              SimpleDateFormat(pattern, Locale.getDefault()).format(Date(t))
          VG_END_OF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_fg.xml <<'VG_END_OF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
