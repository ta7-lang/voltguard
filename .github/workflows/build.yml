                  }
                  body.add(an)
              }

              private fun profileCard(icon: String, title: String, desc: String, color: Int, onClick: () -> Unit): LinearLayout =
                  a.vbox().apply {
                      background = a.rounded(C.CARD, 20f, color)
                      setPadding(a.dp(14), a.dp(14), a.dp(14), a.dp(14))
                      add(a.text(icon, 24f, color, true))
                      add(a.text(title, 14f, C.TEXT, true), top = 6)
                      add(a.text(desc, 11.5f, C.SUB), top = 4)
                      add(a.text("Применить", 13f, color, true), top = 10)
                      setOnClickListener { onClick() }
                  }

              private fun checkRow(c: Check): LinearLayout {
                  val card = a.card()
                  val top = a.hbox()
                  val (dot, dotColor) = when (c.ok) {
                      true -> "✓" to C.MINT
                      false -> "!" to C.AMBER
                      null -> "i" to C.BLUE
                  }
                  top.add(a.text(dot, 14f, 0xFF06121A.toInt(), true).apply {
                      gravity = Gravity.CENTER
                      background = a.rounded(dotColor, 10f)
                  }, a.dp(26), a.dp(26))
                  val tt = a.vbox()
                  tt.add(a.text(c.title, 14.5f, C.TEXT, true))
                  tt.add(a.text(c.state, 12.5f, dotColor, true))
                  top.add(tt, 0, WRAP, 1f, start = 12)
                  val act = c.action
                  if (c.actionLabel != null && act != null) {
                      top.add(a.pill(c.actionLabel, dotColor, filled = c.ok == false) { act() }, WRAP, WRAP, start = 8)
                  }
                  card.add(top)
                  card.add(a.text(c.desc, 12.5f, C.SUB), top = 8)
                  return card
              }
          }
