                  body.add(a.sectionTitle("Профили в одно касание"))
                  val prof = a.hbox()
                  prof.add(profileCard("☾", "Максимальная\nэкономия", "Тайм-аут 15 с, синхронизация и вибро-отклик выкл., автояркость", C.VIOLET) {
                      a.toast(Checks.applyProfile(a, true)); onShow()
                  }, 0, WRAP, 1f, end = 5)
                  prof.add(profileCard("◐", "Сбалансированный\nрежим", "Тайм-аут 1 мин, синхронизация вкл., автояркость", C.CYAN) {
                      a.toast(Checks.applyProfile(a, false)); onShow()
                  }, 0, WRAP, 1f, start = 5)
