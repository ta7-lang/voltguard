          package com.voltguard.app

          import android.os.Build
          import android.view.Gravity
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.abs

          class OverviewScreen(a: MainActivity) : Screen(a) {
              private lateinit var col: LinearLayout
              private lateinit var dynamic: LinearLayout
              private lateinit var ring: RingView
              private lateinit var statusTv: TextView
              private lateinit var leftTv: TextView
              private lateinit var metaTv: TextView
              private var drain: DrainStats? = null
              private val tick = object : Runnable {
                  override fun run() { updateLive(); a.handler.postDelayed(this, 3000) }
              }

              override fun build(): View {
                  val (sv, c) = page("VoltGuard", "${Build.MANUFACTURER.replaceFirstChar { it.uppercase() }} ${Build.MODEL} · Android ${Build.VERSION.RELEASE}")
                  col = c

                  // Hero battery card
                  val hero = a.vbox().apply {
                      background = a.gradient(0xFF14324A.toInt(), 0xFF141A28.toInt(), 24f)
                      setPadding(a.dp(18), a.dp(18), a.dp(18), a.dp(18))
                  }
                  val row = a.hbox()
                  ring = RingView(a)
                  row.add(ring, a.dp(132), a.dp(132))
                  val info = a.vbox()
                  statusTv = info.add(a.text("", 13f, C.MINT, true))
                  leftTv = info.add(a.text("", 22f, C.TEXT, true).apply { typeface = BLACK }, top = 4)
                  metaTv = info.add(a.text("", 12.5f, C.SUB), top = 6)
                  row.add(info, 0, WRAP, 1f, start = 16)
                  hero.add(row)
                  col.add(hero, top = 10)

                  dynamic = col.add(a.vbox())
                  return sv
              }

              override fun onShow() {
                  updateLive()
                  a.handler.removeCallbacks(tick)
                  a.handler.postDelayed(tick, 3000)
                  render()
              }

              override fun onHide() {
                  a.handler.removeCallbacks(tick)
              }

              private fun updateLive() {
                  val b = Battery.read(a)
                  val col1 = when {
                      b.charging -> C.MINT
                      b.pct <= 20 -> C.RED
                      b.pct <= 40 -> C.AMBER
                      else -> C.MINT
                  }
                  ring.set(b.pct / 100f, col1, C.BLUE, "${b.pct.toInt()}%", if (b.charging) "заряд" else "батарея")
                  statusTv.text = if (b.charging) "⚡ Заряжается · ${b.plugText}" else "Работа от батареи"
                  statusTv.setTextColor(if (b.charging) C.MINT else C.SUB)
                  val d = drain
                  leftTv.text = if (b.charging) {
                      if (b.chargeTimeRemainingMs > 0) "до 100%: ${fmtDuration(b.chargeTimeRemainingMs)}" else "Заряжается"
                  } else {
                      val h = if (d != null) Analysis.hoursLeft(b, d) else null
                      if (h != null) "≈ ${fmtHours(h)}" else "Расчёт…"
                  }
                  metaTv.text = "${fmt1(b.tempC)}°C  ·  ${abs(b.currentMa)} мА  ·  ${fmt2(b.powerW)} Вт\n" +
                      "Напряжение ${fmt2(b.voltageMv / 1000f)} В"
              }

              private fun render() {
                  bg({
                      val now = System.currentTimeMillis()
                      val hist = History.load(a, now - 24 * 3_600_000L)
                      val unr = Apps.unrestrictedCount(a)
                      Triple(hist, unr, Booster.mem(a))
                  }) { (hist, unr, mem) ->
                      drain = Analysis.drain(hist)
                      updateLive()
                      fill(hist, unr, mem)
                  }
              }

              private fun fill(hist: List<Sample>, unr: Int, mem: android.app.ActivityManager.MemoryInfo) {
                  dynamic.removeAllViews()
                  val d = drain ?: return
                  val now = System.currentTimeMillis()

                  // Permissions
                  val missing = ArrayList<Triple<String, String, () -> Unit>>()
                  if (!Perms.usage(a)) missing += Triple("Доступ к истории использования", "Анализ приложений, разряжающих батарею", { Perms.requestUsage(a); Unit })
                  if (!Perms.storage()) missing += Triple("Доступ ко всем файлам", "Глубокая очистка мусора", { Perms.requestStorage(a); Unit })
                  if (!Perms.writeSettings(a)) missing += Triple("Изменение системных настроек", "Профили экономии в одно касание", { Perms.requestWrite(a); Unit })
                  if (missing.isNotEmpty()) {
                      val pc = a.card(0xFF2A2140.toInt())
                      pc.add(a.text("Выдайте разрешения для полной работы", 15f, C.TEXT, true))
                      for ((t, s, act) in missing) {
                          val r = a.hbox()
                          val txt = a.vbox()
                          txt.add(a.text(t, 13.5f, C.TEXT, true))
                          txt.add(a.text(s, 12f, C.SUB))
                          r.add(txt, 0, WRAP, 1f)
                          r.add(a.pill("Выдать", C.VIOLET) { act() }, WRAP, WRAP, start = 8)
                          pc.add(r, top = 12)
                      }
                      dynamic.add(pc, top = 12)
                  }

                  // Optimization score
                  val checks = Checks.all(a, unr)
                  val score = Checks.score(checks)
                  val sc = a.card()
                  val sr = a.hbox()
                  val sring = RingView(a).apply { strokeDp = 9f }
                  val scol = when { score >= 80 -> C.MINT; score >= 50 -> C.AMBER; else -> C.RED }
                  sring.set(score / 100f, scol, C.VIOLET, "$score", "из 100")
                  sr.add(sring, a.dp(92), a.dp(92))
                  val st = a.vbox()
                  st.add(a.text("Оптимизация энергии", 16f, C.TEXT, true))
                  val bad = checks.count { it.ok == false }
                  st.add(a.text(if (bad == 0) "Всё настроено оптимально" else "Можно улучшить пунктов: $bad", 13f, C.SUB), top = 2)
                  st.add(a.pill(if (bad == 0) "Подробнее" else "Исправить", scol) { a.select(2) }, WRAP, WRAP, top = 10)
                  sr.add(st, 0, WRAP, 1f, start = 16)
                  sc.add(sr)
                  dynamic.add(sc, top = 12)

                  // Quick actions
                  dynamic.add(a.sectionTitle("Быстрые действия"))
                  val qa = listOf(
                      Triple("⚡", "Ускорить", C.BLUE) to { boost() },
                      Triple("✦", "Очистка", C.MINT) to { a.select(3) },
                      Triple("❖", "Энергосбережение", C.AMBER) to { Checks.batterySaver(a); Unit },
                      Triple("☾", "Профиль «Макс.»", C.VIOLET) to { a.toast(Checks.applyProfile(a, true)); a.refresh() }
                  )
                  val tiles = qa.map { (meta, act) ->
                      val (ic, label, color) = meta
                      a.vbox().apply {
                          background = a.rounded(C.CARD, 18f)
                          setPadding(a.dp(14), a.dp(14), a.dp(14), a.dp(14))
                          add(a.text(ic, 22f, color, true))
                          add(a.text(label, 13.5f, C.TEXT, true), top = 6)
                          setOnClickListener { act() }
                      }
                  }
                  dynamic.add(a.grid(tiles, 2))

                  // Resources
                  dynamic.add(a.sectionTitle("Ресурсы"))
                  val usedRam = mem.totalMem - mem.availMem
                  val (total, free) = Cleaner.storage()
                  val res = a.card()
                  res.add(resourceRow("Оперативная память", "${fmtBytes(usedRam)} из ${fmtBytes(mem.totalMem)}", usedRam.toFloat() / mem.totalMem, C.BLUE))
                  res.add(resourceRow("Хранилище", "${fmtBytes(total - free)} из ${fmtBytes(total)}", (total - free).toFloat() / total, C.VIOLET), top = 14)
                  dynamic.add(res)

                  // Idle drain
                  dynamic.add(a.sectionTitle("Разряд за 24 часа"))
                  val dc = a.card()
                  val (verdict, vcol) = Analysis.idleVerdict(d.idleRate)
                  val tiles2 = listOf(
                      a.statTile("В покое (экран выкл.)", d.idleRate?.let { "${fmt2(it)} %/ч" } ?: "—", vcol).first,
                      a.statTile("Активное использование", d.activeRate?.let { "${fmt1(it)} %/ч" } ?: "—", C.CYAN).first
                  )
                  dc.add(a.grid(tiles2, 2))
                  dc.add(a.text("Оценка разряда в покое: $verdict", 13f, vcol, true), top = 10)
                  val spark = LineChartView(a).apply { compact = true; emptyText = "Данные появятся через ~30 минут" }
                  spark.setData(hist.map { it.t }, hist.map { it.pct }, 0f, 100f, now - 24 * 3_600_000L, now, C.MINT, "%", hist.map { it.charging })
                  dc.add(spark, MATCH, a.dp(70), top = 12)
                  dc.setOnClickListener { a.select(1) }
                  dynamic.add(dc)

                  dynamic.add(a.text("VoltGuard не работает постоянно в фоне: замер раз в 15 минут через системный планировщик, это практически не расходует батарею.", 11.5f, C.SUB).apply {
                      gravity = Gravity.CENTER
                  }, top = 16)
              }

              private fun resourceRow(title: String, value: String, frac: Float, color: Int): LinearLayout {
                  val box = a.vbox()
                  val r = a.hbox()
                  r.add(a.text(title, 13.5f, C.TEXT, true), 0, WRAP, 1f)
                  r.add(a.text(value, 12.5f, C.SUB), WRAP, WRAP)
                  box.add(r)
                  box.add(MiniBar(a).apply { fraction = frac; this.color = color }, MATCH, a.dp(8), top = 8)
                  return box
              }

              private fun boost() {
                  a.toast("Оптимизация памяти…")
                  bg({
                      val before = Booster.mem(a).availMem
                      val n = Booster.boost(a)
                      Thread.sleep(1500)
                      val after = Booster.mem(a).availMem
                      n to (after - before)
                  }) { (n, freed) ->
                      a.toast(
                          if (freed > 8L * 1024 * 1024) "Освобождено ${fmtBytes(freed)} · обработано приложений: $n"
                          else "Память уже в оптимальном состоянии (проверено приложений: $n)"
                      )
                      render()
                  }
              }
          }
