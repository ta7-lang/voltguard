          package com.voltguard.app

          import android.content.Intent
          import android.os.storage.StorageManager
          import android.view.Gravity
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.TextView

          class CleanerScreen(a: MainActivity) : Screen(a) {
              private lateinit var body: LinearLayout
              private var cats: List<JunkCategory>? = null
              private var scanning = false
              private var lastResult: String? = null
              private var progressTv: TextView? = null
              private var footerTv: TextView? = null

              override fun build(): View {
                  val (sv, col) = page("Очистка", "Глубокий поиск мусора во внутренней памяти")
                  body = col.add(a.vbox())
                  return sv
              }

              override fun onShow() { render() }

              private fun render() {
                  body.removeAllViews()
                  progressTv = null
                  footerTv = null

                  // Storage donut
                  val (total, free) = Cleaner.storage()
                  val used = total - free
                  val junk = cats?.sumOf { it.total } ?: 0L
                  val sc = a.card()
                  val r = a.hbox()
                  val donut = DonutView(a)
                  donut.set(
                      listOf((used - junk).toFloat() to C.VIOLET, junk.toFloat() to C.AMBER, free.toFloat() to C.LINE),
                      "${used * 100 / total}%", "занято"
                  )
                  r.add(donut, a.dp(120), a.dp(120))
                  val legend = a.vbox()
                  legend.add(legendRow(C.VIOLET, "Занято", fmtBytes(used - junk)))
                  if (junk > 0) legend.add(legendRow(C.AMBER, "Найден мусор", fmtBytes(junk)), top = 8)
                  legend.add(legendRow(C.LINE, "Свободно", fmtBytes(free)), top = 8)
                  legend.add(a.text("Всего ${fmtBytes(total)}", 12f, C.SUB), top = 8)
                  r.add(legend, 0, WRAP, 1f, start = 16)
                  sc.add(r)
                  body.add(sc, top = 10)

                  lastResult?.let {
                      val rc = a.card(0xFF12352C.toInt())
                      rc.add(a.text("✓ $it", 15f, C.MINT, true))
                      body.add(rc, top = 12)
                  }

                  // System cache
                  body.add(a.sectionTitle("Кэш всех приложений"))
                  val cc = a.card()
                  cc.add(a.text("Системная очистка кэша", 15f, C.TEXT, true))
                  cc.add(a.text("Официальный способ Android 11+: система удаляет кэш всех приложений сразу (после подтверждения). Данные и вход в аккаунты сохраняются.", 12.5f, C.SUB), top = 4)
                  cc.add(a.pill("Очистить кэш приложений", C.CYAN) { clearAppCache() }, WRAP, WRAP, top = 12)
                  body.add(cc)

                  // File scan
                  body.add(a.sectionTitle("Глубокое сканирование"))
                  if (!Perms.storage()) {
                      val pc = a.card(0xFF2A2140.toInt())
                      pc.add(a.text("Нужен доступ ко всем файлам", 15f, C.TEXT, true))
                      pc.add(a.text("Без него Android не позволяет найти временные файлы, логи, дубликаты и остатки удалённых приложений. VoltGuard ничего не отправляет в интернет — у приложения даже нет такого разрешения.", 12.5f, C.SUB), top = 4)
                      pc.add(a.pill("Разрешить доступ", C.VIOLET) { Perms.requestStorage(a) }, WRAP, WRAP, top = 12)
                      body.add(pc)
                      return
                  }

                  if (scanning) {
                      val pc = a.card()
                      pc.add(a.text("Сканирование…", 16f, C.TEXT, true))
                      progressTv = pc.add(a.text("Подготовка", 12f, C.SUB).apply { maxLines = 2 }, top = 6)
                      body.add(pc)
                      return
                  }

                  val list = cats
                  if (list == null) {
                      val pc = a.card()
                      pc.add(a.text("Найдём: временные файлы, логи, кэш миниатюр, пустые папки, остатки удалённых приложений, старые APK, дубликаты, большие и давно забытые файлы.", 13f, C.SUB))
                      pc.add(a.pill("Начать сканирование", C.MINT) { scan() }, MATCH, WRAP, top = 14)
                      body.add(pc)
                      return
                  }

                  for (c in list) body.add(categoryCard(c), bottom = 10)

                  val foot = a.card(C.CARD2)
                  footerTv = foot.add(a.text("", 14f, C.TEXT, true))
                  updateFooter()
                  val br = a.hbox()
                  br.add(a.pill("Пересканировать", C.BLUE, filled = false) { cats = null; scan() }, 0, WRAP, 1f, end = 5)
                  br.add(a.pill("Очистить", C.MINT) { confirmClean() }, 0, WRAP, 1f, start = 5)
                  foot.add(br, top = 12)
                  body.add(foot, top = 4)
                  body.add(a.text("Категории с красной/серой меткой не выбраны автоматически — проверьте их содержимое перед удалением.", 11.5f, C.SUB), top = 10)
              }

              private fun legendRow(color: Int, label: String, value: String): LinearLayout {
                  val r = a.hbox()
                  r.add(View(a).apply { background = a.rounded(color, 4f) }, a.dp(10), a.dp(10))
                  r.add(a.text(label, 12.5f, C.SUB), 0, WRAP, 1f, start = 8)
                  r.add(a.text(value, 13f, C.TEXT, true), WRAP, WRAP)
                  return r
              }

              private fun updateFooter() {
                  val list = cats ?: return
                  val size = list.sumOf { it.selectedSize }
                  val n = list.sumOf { c -> c.items.count { it.selected } }
                  footerTv?.text = "Выбрано: ${fmtBytes(size)} · объектов: $n"
              }

              private fun checkBox(checked: Boolean, color: Int): TextView =
                  a.text(if (checked) "✓" else "", 14f, 0xFF06121A.toInt(), true).apply {
                      gravity = Gravity.CENTER
                      background = if (checked) a.rounded(color, 7f) else a.rounded(0x00000000, 7f, C.SUB)
                  }

              private fun categoryCard(c: JunkCategory): LinearLayout {
                  val card = a.card()
                  val head = a.hbox()
                  val cb = checkBox(c.allSelected, c.color)
                  head.add(cb, a.dp(24), a.dp(24))
                  val tt = a.vbox()
                  tt.add(a.text(c.title, 14.5f, C.TEXT, true))
                  tt.add(a.text("${c.items.size} шт. · ${fmtBytes(c.total)}" + if (!c.safe) " · проверьте вручную" else "", 12f, if (c.safe) C.SUB else C.AMBER))
                  head.add(tt, 0, WRAP, 1f, start = 12)
                  val arrow = head.add(a.text(if (c.expanded) "▲" else "▼", 13f, C.SUB), WRAP, WRAP, start = 8)
                  card.add(head)
                  card.add(a.text(c.desc, 12f, C.SUB), top = 6)

                  cb.setOnClickListener {
                      val v = !c.allSelected
                      c.items.forEach { it.selected = v }
                      render()
                  }
                  val toggle = View.OnClickListener {
                      if (c.items.isNotEmpty()) { c.expanded = !c.expanded; render() }
                  }
                  tt.setOnClickListener(toggle)
                  arrow.setOnClickListener(toggle)

                  if (c.expanded) {
                      val root = android.os.Environment.getExternalStorageDirectory().absolutePath
                      val shown = c.items.take(150)
                      for (item in shown) {
                          val row = a.hbox().apply { setPadding(0, a.dp(8), 0, 0) }
                          val icb = checkBox(item.selected, c.color)
                          row.add(icb, a.dp(20), a.dp(20))
                          val info = a.vbox()
                          info.add(a.text(item.file.name, 12.5f, C.TEXT).apply { maxLines = 1 })
                          val sub = (if (item.note.isNotEmpty()) item.note + " · " else "") + item.file.parent.orEmpty().removePrefix(root)
                          info.add(a.text(sub, 10.5f, C.SUB).apply { maxLines = 1 })
                          row.add(info, 0, WRAP, 1f, start = 10)
                          row.add(a.text(fmtBytes(item.size), 11.5f, C.SUB), WRAP, WRAP, start = 6)
                          row.setOnClickListener {
                              item.selected = !item.selected
                              icb.text = if (item.selected) "✓" else ""
                              icb.background = if (item.selected) a.rounded(c.color, 7f) else a.rounded(0x00000000, 7f, C.SUB)
                              cb.text = if (c.allSelected) "✓" else ""
                              cb.background = if (c.allSelected) a.rounded(c.color, 7f) else a.rounded(0x00000000, 7f, C.SUB)
                              updateFooter()
                          }
                          card.add(row)
                      }
                      if (c.items.size > shown.size) {
                          card.add(a.text("…и ещё ${c.items.size - shown.size}", 11.5f, C.SUB), top = 6)
                      }
                  }
                  return card
              }

              private fun scan() {
                  scanning = true
                  lastResult = null
                  render()
                  bg({
                      Cleaner.scan(a) { path, n ->
                          a.handler.post { progressTv?.text = "Проверено файлов: $n\n$path" }
                      }
                  }) { result ->
                      scanning = false
                      cats = result
                      render()
                  }
              }

              private fun confirmClean() {
                  val list = cats ?: return
                  val size = list.sumOf { it.selectedSize }
                  if (size == 0L && list.none { c -> c.items.any { it.selected } }) {
                      a.toast("Ничего не выбрано"); return
                  }
                  android.app.AlertDialog.Builder(a, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle("Удалить выбранное?")
                      .setMessage("Будет освобождено ${fmtBytes(size)}. Удалённые файлы нельзя восстановить.")
                      .setPositiveButton("Удалить") { _, _ -> clean() }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun clean() {
                  val list = cats ?: return
                  a.toast("Очистка…")
                  bg({ Cleaner.clean(list) }) { (n, freed) ->
                      lastResult = "Удалено объектов: $n · освобождено ${fmtBytes(freed)}"
                      render()
                  }
              }

              private fun clearAppCache() {
                  if (!Perms.storage()) {
                      a.toast("Сначала разрешите доступ ко всем файлам")
                      Perms.requestStorage(a)
                      return
                  }
                  try {
                      @Suppress("DEPRECATION")
                      a.startActivityForResult(Intent(StorageManager.ACTION_CLEAR_APP_CACHE), 77)
                  } catch (e: Throwable) {
                      a.toast("Система не поддерживает: откройте Настройки → Хранилище")
                      a.openFirst(Intent(android.provider.Settings.ACTION_INTERNAL_STORAGE_SETTINGS))
                  }
              }
          }
