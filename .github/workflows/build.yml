          package com.voltguard.app

          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Environment
          import android.os.StatFs
          import java.io.File
          import java.io.FileInputStream
          import java.security.MessageDigest

          class JunkItem(val file: File, val size: Long, var selected: Boolean, val note: String = "")

          class JunkCategory(
              val id: String,
              val title: String,
              val desc: String,
              val color: Int,
              val safe: Boolean
          ) {
              val items = ArrayList<JunkItem>()
              var expanded = false
              val total: Long get() = items.sumOf { it.size }
              val selectedSize: Long get() = items.filter { it.selected }.sumOf { it.size }
              val allSelected: Boolean get() = items.isNotEmpty() && items.all { it.selected }
          }

          object Cleaner {
              private val TEMP_EXT = setOf("tmp", "temp", "bak", "old", "part", "crdownload", "chk", "gid", "~tmp")
              private val LOG_EXT = setOf("log", "trace", "dmp", "dump", "anr", "hprof", "logcat", "xlog")
              private val LOG_DIRS = setOf("debug_log", "logs", "log", "crash", "crashes", "tombstones", "bugreports", "mtklog", "miuilog", "offlinelog")
              private val APK_EXT = setOf("apk", "apks", "xapk", "apkm")
              private val PROTECTED_ROOT = setOf(
                  "dcim", "download", "pictures", "music", "movies", "documents", "android",
                  "alarms", "notifications", "podcasts", "ringtones", "recordings", "audiobooks", "miui"
              )
              private const val LARGE = 100L * 1024 * 1024
              private const val OLD_DL_MS = 90L * 24 * 3_600_000L
              private const val MAX_FILES = 400_000

              fun hasAccess(): Boolean = Environment.isExternalStorageManager()

              fun storage(): Pair<Long, Long> {
                  val st = StatFs(Environment.getDataDirectory().path)
                  return st.totalBytes to st.availableBytes
              }

              fun scan(ctx: Context, progress: (String, Int) -> Unit): List<JunkCategory> {
                  val temp = JunkCategory("temp", "Временные файлы", "*.tmp, *.bak, недокачанные загрузки", C.MINT, true)
                  val logs = JunkCategory("logs", "Логи и отчёты об ошибках", "Журналы приложений и системы, дампы сбоев", C.CYAN, true)
                  val thumbs = JunkCategory("thumbs", "Кэш миниатюр", "Папки .thumbnails — пересоздаются автоматически", C.BLUE, true)
                  val empty = JunkCategory("empty", "Пустые папки", "Папки без файлов, оставленные приложениями", C.VIOLET, true)
                  val residual = JunkCategory("residual", "Остатки удалённых приложений", "Данные в Android/media от приложений, которых уже нет", C.AMBER, true)
                  val apks = JunkCategory("apk", "Установочные APK", "Файлы установки, которые больше не нужны", 0xFFFF8A5B.toInt(), true)
                  val dups = JunkCategory("dups", "Дубликаты", "Одинаковые файлы — оригинал (самый старый) сохраняется", C.RED, false)
                  val large = JunkCategory("large", "Большие файлы (>100 МБ)", "Проверьте вручную, что они не нужны", 0xFFE36BFF.toInt(), false)
                  val oldDl = JunkCategory("olddl", "Старые загрузки (>90 дней)", "Файлы в «Загрузках», к которым давно не обращались", 0xFF7AA2C9.toInt(), false)

                  val root = Environment.getExternalStorageDirectory()
                  val rootPath = root.absolutePath
                  val skip = setOf("$rootPath/Android/data", "$rootPath/Android/obb")
                  val downloadPath = File(root, "Download").absolutePath
                  val now = System.currentTimeMillis()
                  val sizeGroups = HashMap<Long, ArrayList<File>>()
                  val residualPaths = HashSet<String>()
                  val dirs = ArrayList<File>()

                  val stack = ArrayDeque<File>()
                  stack.add(root)
                  var count = 0
                  while (stack.isNotEmpty() && count < MAX_FILES) {
                      val dir = stack.removeLast()
                      val children = dir.listFiles() ?: continue
                      if (dir != root) dirs.add(dir)
                      for (f in children) {
                          val path = f.absolutePath
                          if (f.isDirectory) {
                              if (path in skip || path in residualPaths) continue
                              if (path == "$rootPath/Android/media") {
                                  scanResidual(ctx, f, residual)
                                  residual.items.forEach { residualPaths.add(it.file.absolutePath) }
                              }
                              stack.add(f)
                              continue
                          }
                          count++
                          if (count % 500 == 0) progress(path.removePrefix(rootPath), count)
                          val size = f.length()
                          val name = f.name.lowercase()
                          val ext = name.substringAfterLast('.', "")
                          val parentName = f.parentFile?.name?.lowercase() ?: ""
                          val lowerPath = path.lowercase()
                          when {
                              lowerPath.contains("/.thumbnails/") -> thumbs.items.add(JunkItem(f, size, true))
                              ext in TEMP_EXT || name.endsWith("~") || name.startsWith(".~") -> temp.items.add(JunkItem(f, size, true))
                              ext in LOG_EXT || (parentName in LOG_DIRS && ext in setOf("txt", "gz", "zip", "")) ->
                                  logs.items.add(JunkItem(f, size, true))
                              ext in APK_EXT -> apks.items.add(JunkItem(f, size, true))
                              size >= LARGE -> large.items.add(JunkItem(f, size, false))
                              path.startsWith(downloadPath) && now - f.lastModified() > OLD_DL_MS ->
                                  oldDl.items.add(JunkItem(f, size, false))
                              else -> if (size >= 64 * 1024 && !path.startsWith("$rootPath/Android/")) {
                                  sizeGroups.getOrPut(size) { ArrayList() }.add(f)
                              }
                          }
                      }
                  }

                  // Empty folders (deepest first, so nested empty trees are found)
                  progress("Поиск пустых папок…", count)
                  val emptySet = HashSet<String>()
                  for (d in dirs.sortedByDescending { it.absolutePath.length }) {
                      val rel = d.absolutePath.removePrefix("$rootPath/")
                      if (!rel.contains('/') && rel.lowercase() in PROTECTED_ROOT) continue
                      if (rel.startsWith("Android/")) continue
                      val kids = d.listFiles() ?: continue
                      if (kids.all { it.isDirectory && it.absolutePath in emptySet }) {
                          emptySet.add(d.absolutePath)
                      }
                  }
                  // Only report top-most empty folders (deleting them removes nested ones)
                  for (p in emptySet) {
                      val parent = File(p).parent
                      if (parent == null || parent !in emptySet) empty.items.add(JunkItem(File(p), 0L, true))
                  }

                  // Duplicates
                  progress("Поиск дубликатов…", count)
                  for ((size, files) in sizeGroups) {
                      if (files.size < 2 || size > 512L * 1024 * 1024) continue
                      val byHash = HashMap<String, ArrayList<File>>()
                      for (f in files) {
                          val h = hash(f) ?: continue
                          byHash.getOrPut(h) { ArrayList() }.add(f)
                      }
                      for (group in byHash.values) {
                          if (group.size < 2) continue
                          val sorted = group.sortedBy { it.lastModified() }
                          val original = sorted.first()
                          for (copy in sorted.drop(1)) {
                              dups.items.add(JunkItem(copy, size, false, "Копия: ${original.name}"))
                          }
                      }
                  }

                  val all = listOf(temp, logs, thumbs, empty, residual, apks, dups, large, oldDl)
                  all.forEach { c -> c.items.sortByDescending { it.size } }
                  return all
              }

              private fun scanResidual(ctx: Context, media: File, cat: JunkCategory) {
                  val pm = ctx.packageManager
                  val kids = media.listFiles() ?: return
                  for (d in kids) {
                      if (!d.isDirectory) continue
                      val pkg = d.name
                      if (!pkg.contains('.')) continue
                      val installed = try {
                          pm.getPackageInfo(pkg, 0); true
                      } catch (e: PackageManager.NameNotFoundException) { false }
                      if (!installed) cat.items.add(JunkItem(d, dirSize(d), true, pkg))
                  }
              }

              fun dirSize(f: File): Long {
                  if (f.isFile) return f.length()
                  var total = 0L
                  f.walkTopDown().forEach { if (it.isFile) total += it.length() }
                  return total
              }

              private fun hash(f: File): String? = try {
                  val md = MessageDigest.getInstance("MD5")
                  FileInputStream(f).use { input ->
                      val buf = ByteArray(64 * 1024)
                      while (true) {
                          val n = input.read(buf)
                          if (n <= 0) break
                          md.update(buf, 0, n)
                      }
                  }
                  md.digest().joinToString("") { "%02x".format(it) }
              } catch (e: Throwable) { null }

              /** Deletes the selected items. Returns (deleted count, freed bytes). */
              fun clean(cats: List<JunkCategory>): Pair<Int, Long> {
                  var n = 0
                  var freed = 0L
                  for (c in cats) {
                      val it = c.items.iterator()
                      while (it.hasNext()) {
                          val item = it.next()
                          if (!item.selected) continue
                          val ok = if (item.file.isDirectory) item.file.deleteRecursively() else item.file.delete()
                          if (ok || !item.file.exists()) {
                              n++; freed += item.size; it.remove()
                          }
                      }
                  }
                  return n to freed
              }
          }
          VG_END_OF_FILE
