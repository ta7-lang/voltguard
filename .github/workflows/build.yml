          mkdir -p app/src/main/java/com/voltguard/app
          cat > app/src/main/java/com/voltguard/app/AppsScreen.kt <<'VG_END_OF_FILE'
          package com.voltguard.app

          import android.content.Intent
          import android.net.Uri
          import android.view.View
          import android.widget.ImageView
          import android.widget.LinearLayout

          class AppsScreen(a: MainActivity) : Screen(a) {
              private lateinit var body: LinearLayout
              var filter = 0 // 0 screen time, 1 background, 2 unrestricted, 3 unused
              private var days = 1
              private var data: List<AppStat>? = null
              private var loadedDays = -1

              override fun build(): View {
                  val (sv, col) = page("Приложения", "Кто расходует батарею — на экране и в фоне")
                  body = col.add(a.vbox())
                  return sv
              }

              override fun onShow() {
                  if (data == null || loadedDays != days) load() else render()
              }

              private fun load() {
                  body.removeAllViews()
                  body.add(a.text("Анализ приложений…", 14f, C.SUB), top = 20)
                  val d = days
                  bg({ Apps.load(a, if (filter == 3) 30 else d) }) { list ->
                      data = list; loadedDays = if (filter == 3) -1 else d
                      render()
                  }
              }

              private fun render() {
                  body.removeAllViews()
                  val tabs = a.vbox()
                  val r1 = a.hbox()
                  val r2 = a.hbox()
                  listOf("Экранное время", "Работа в фоне").forEachIndexed { i, l ->
                      r1.add(a.chip(l, filter == i) { switch(i) }, 0, WRAP, 1f, start = if (i == 0) 0 else 4, end = if (i == 0) 4 else 0)
                  }
                  listOf("Без ограничений", "Неиспользуемые").forEachIndexed { k, l ->
                      val i = k + 2
                      r2.add(a.chip(l, filter == i) { switch(i) }, 0, WRAP, 1f, start = if (k == 0) 0 else 4, end = if (k == 0) 4 else 0)
                  }
                  tabs.add(r1)
                  tabs.add(r2, top = 8)
                  body.add(tabs, top = 10)

                  if (filter <= 1) {
                      val pr = a.hbox()
                      listOf(1 to "24 ч", 7 to "7 дней").forEach { (n, l) ->
                          pr.add(a.chip(l, days == n) { days = n; load() }, WRAP, WRAP, end = 8)
                      }
                      body.add(pr, top = 10)
                  }

                  if (!Perms.usage(a) && filter != 2) {
                      val pc = a.card(0xFF2A2140.toInt())
                      pc.add(a.text("Нужен доступ к истории использования", 15f, C.TEXT, true))
                      pc.add(a.text("Android выдаёт статистику работы приложений только с этим разрешением. Найдите VoltGuard в списке и включите доступ.", 12.5f, C.SUB), top = 4)
                      pc.add(a.pill("Разрешить", C.VIOLET) { Perms.requestUsage(a) }, WRAP, WRAP, top = 12)
                      body.add(pc, top = 14)
                      return
                  }

                  val all = data ?: return
                  val now = System.currentTimeMillis()
                  val (title, hint, list) = when (filter) {
                      0 -> Triple(
                          "Время на экране", "Экран — крупнейший потребитель энергии. Здесь видно, где он работает дольше всего.",
                          all.filter { it.fg > 60_000 }.sortedByDescending { it.fg }
                      )
                      1 -> Triple(
                          "Фоновая работа (разряд в покое)", "Время, когда приложение держало фоновую службу и не давало телефону уснуть. Главные кандидаты на ограничение.",
                          all.filter { it.fgs > 60_000 }.sortedByDescending { it.fgs }
                      )
                      2 -> Triple(
                          "Без ограничений батареи", "Эти приложения исключены из оптимизации Android и могут работать в фоне сколько угодно. Оставьте только мессенджеры и будильники.",
                          all.filter { it.unrestricted && !it.system }.sortedByDescending { it.fgs }
                      )
                      else -> Triple(
                          "Не используются 30+ дней", "Удаление лишних приложений освобождает память и убирает их фоновые задачи.",
                          all.filter { !it.system && it.fg < 60_000 && (it.lastUsed == 0L || now - it.lastUsed > 30L * 24 * 3_600_000L) && now - it.installed > 30L * 24 * 3_600_000L }
                              .sortedBy { it.label.lowercase() }
                      )
                  }

                  body.add(a.sectionTitle(title))
                  body.add(a.text(hint, 12.5f, C.SUB), bottom = 10)

                  if (list.isEmpty()) {
                      val ec = a.card()
                      ec.add(a.text(if (filter == 1) "Ни одно приложение не держало фоновых служб — отлично!" else "Список пуст", 14f, C.MINT, true))
                      body.add(ec)
                      return
                  }

                  val metric: (AppStat) -> Long = when (filter) { 0 -> { s -> s.fg }; else -> { s -> s.fgs } }
                  val maxV = list.maxOf { metric(it) }.coerceAtLeast(1L)
                  val total = list.sumOf { metric(it) }
                  if (filter <= 1) {
                      body.add(a.text("Итого: ${fmtDuration(total)} за ${if (days == 1) "24 ч" else "$days дн."}", 13f, C.TEXT, true), bottom = 10)
                  }

                  val card = a.card()
                  list.take(60).forEachIndexed { i, s ->
                      card.add(appRow(s, metric(s), maxV), top = if (i == 0) 0 else 14)
                  }
                  body.add(card)
                  if (filter == 1 || filter == 2) {
                      body.add(a.text("Нажмите на приложение → «Контроль активности» / «Батарея» → выберите «Ограничить» или «Умный режим».", 12f, C.SUB), top = 10)
                  }
                  if (filter == 2 || filter == 1) {
                      body.add(a.pill("Настройки батареи HyperOS", C.AMBER, filled = false) { Checks.xiaomiBattery(a) }, WRAP, WRAP, top = 10)
                  }
              }

              private fun switch(i: Int) {
                  val needReload = (i == 3) != (filter == 3)
                  filter = i
                  if (needReload || data == null) { data = null; load() } else render()
              }

              private fun appRow(s: AppStat, value: Long, maxV: Long): LinearLayout {
                  val row = a.hbox()
                  val iv = ImageView(a).apply { setImageDrawable(s.icon) }
                  row.add(iv, a.dp(38), a.dp(38))
                  val mid = a.vbox()
                  val top = a.hbox()
                  top.add(a.text(s.label, 14f, C.TEXT, true).apply { maxLines = 1 }, 0, WRAP, 1f)
                  val right = when (filter) {
                      0, 1 -> fmtDuration(value)
                      2 -> if (s.fgs > 0) "фон ${fmtDuration(s.fgs)}" else ""
                      else -> if (s.lastUsed > 0) "был ${fmtTime(s.lastUsed, "dd.MM.yy")}" else "не запускалось"
                  }
                  top.add(a.text(right, 12.5f, if (filter == 1) C.AMBER else C.SUB, true), WRAP, WRAP, start = 8)
                  mid.add(top)
                  val tags = ArrayList<String>()
                  if (s.unrestricted) tags += "без ограничений"
                  if (s.system) tags += "системное"
                  if (filter == 0 && s.fgs > 60_000) tags += "фон ${fmtDuration(s.fgs)}"
                  if (tags.isNotEmpty()) mid.add(a.text(tags.joinToString(" · "), 11f, if (s.unrestricted) C.AMBER else C.SUB))
                  if (filter <= 1) {
                      mid.add(MiniBar(a).apply {
                          fraction = value.toFloat() / maxV
                          color = if (filter == 1) C.AMBER else C.BLUE
                      }, MATCH, a.dp(6), top = 6)
                  }
                  row.add(mid, 0, WRAP, 1f, start = 12)
                  if (filter == 3) {
                      row.add(a.pill("Удалить", C.RED, filled = false) {
                          a.openFirst(Intent(Intent.ACTION_DELETE, Uri.parse("package:${s.pkg}")))
                      }, WRAP, WRAP, start = 8)
                  }
                  row.setOnClickListener { a.appDetails(s.pkg) }
                  return row
              }
          }
          VG_END_OF_FILE
          mkdir -p app/src/main/java/com/voltguard/app
          cat > app/src/main/java/com/voltguard/app/Battery.kt <<'VG_END_OF_FILE'
          package com.voltguard.app

          import android.app.job.JobInfo
          import android.app.job.JobParameters
          import android.app.job.JobScheduler
          import android.app.job.JobService
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager
          import android.os.PowerManager
          import java.io.File
          import java.util.Calendar
          import kotlin.math.abs
          import kotlin.math.max

          data class BatterySnap(
              val time: Long,
              val pct: Float,
              val charging: Boolean,
              val plugged: Int,
              val status: Int,
              val tempC: Float,
              val voltageMv: Int,
              val health: Int,
              val technology: String,
              val currentMa: Int,
              val chargeMah: Int,
              val cycleCount: Int,
              val chargeTimeRemainingMs: Long
          ) {
              val powerW: Float get() = abs(currentMa) * voltageMv / 1_000_000f

              /** Estimated full capacity in mAh from the charge counter, or -1. */
              val estCapacityMah: Int
                  get() = if (chargeMah > 0 && pct >= 5f) (chargeMah / (pct / 100f)).toInt() else -1

              val healthText: String
                  get() = when (health) {
                      BatteryManager.BATTERY_HEALTH_GOOD -> "Хорошее"
                      BatteryManager.BATTERY_HEALTH_OVERHEAT -> "Перегрев"
                      BatteryManager.BATTERY_HEALTH_DEAD -> "Изношена"
                      BatteryManager.BATTERY_HEALTH_OVER_VOLTAGE -> "Перенапряжение"
                      BatteryManager.BATTERY_HEALTH_COLD -> "Холод"
                      BatteryManager.BATTERY_HEALTH_UNSPECIFIED_FAILURE -> "Сбой"
                      else -> "Неизвестно"
                  }

              val plugText: String
                  get() = when (plugged) {
                      BatteryManager.BATTERY_PLUGGED_AC -> "Сеть"
                      BatteryManager.BATTERY_PLUGGED_USB -> "USB"
                      BatteryManager.BATTERY_PLUGGED_WIRELESS -> "Беспроводная"
                      else -> "Не подключено"
                  }
          }

          object Battery {
              /** Rated capacity of the Xiaomi 15T battery. */
              const val DESIGN_MAH = 5500

              fun read(ctx: Context): BatterySnap {
                  val i: Intent? = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED), Context.RECEIVER_NOT_EXPORTED)
                  val level = i?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = i?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                  val status = i?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val plugged = i?.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) ?: 0
                  val temp = (i?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10f
                  val volt = i?.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0) ?: 0
                  val health = i?.getIntExtra(BatteryManager.EXTRA_HEALTH, 1) ?: 1
                  val tech = i?.getStringExtra(BatteryManager.EXTRA_TECHNOLOGY) ?: "Li-ion"
                  val cycles = i?.getIntExtra("android.os.extra.CYCLE_COUNT", -1) ?: -1

                  val bm = ctx.getSystemService(BatteryManager::class.java)
                  val raw = bm?.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW) ?: Int.MIN_VALUE
                  val curMa = when {
                      raw == Int.MIN_VALUE -> 0
                      abs(raw) > 20000 -> raw / 1000 // microamps
                      else -> raw
                  }
                  val cc = bm?.getIntProperty(BatteryManager.BATTERY_PROPERTY_CHARGE_COUNTER) ?: Int.MIN_VALUE
                  val ccMah = when {
                      cc == Int.MIN_VALUE || cc <= 0 -> -1
                      cc > 100000 -> cc / 1000
                      else -> cc
                  }
                  val remain = try { bm?.computeChargeTimeRemaining() ?: -1L } catch (e: Throwable) { -1L }
                  val pct = if (level >= 0 && scale > 0) level * 100f / scale else 0f
                  return BatterySnap(
                      System.currentTimeMillis(), pct, plugged != 0, plugged, status, temp, volt, health,
                      tech, curMa, ccMah, cycles, remain
                  )
              }

              fun isScreenOn(ctx: Context): Boolean =
                  ctx.getSystemService(PowerManager::class.java)?.isInteractive ?: true
          }

          data class Sample(
              val t: Long,
              val pct: Float,
              val charging: Boolean,
              val screenOn: Boolean,
              val temp: Float,
              val curMa: Int
          )

          object History {
              private const val FILE = "history.csv"
              private const val MAX_AGE = 14L * 24 * 3_600_000L

              @Synchronized
              fun add(ctx: Context, s: Sample) {
                  val f = File(ctx.filesDir, FILE)
                  val prefs = ctx.getSharedPreferences("hist", Context.MODE_PRIVATE)
                  val last = prefs.getLong("last_t", 0L)
                  if (s.t - last < 60_000L) return
                  f.appendText("${s.t},${s.pct},${if (s.charging) 1 else 0},${if (s.screenOn) 1 else 0},${s.temp},${s.curMa}\n")
                  prefs.edit().putLong("last_t", s.t).apply()
                  if (f.length() > 400_000L) prune(f)
              }

              private fun prune(f: File) {
                  val cut = System.currentTimeMillis() - MAX_AGE
                  val keep = f.readLines().filter { line ->
                      line.substringBefore(',').toLongOrNull()?.let { it >= cut } ?: false
                  }
                  f.writeText(keep.joinToString("\n", postfix = if (keep.isEmpty()) "" else "\n"))
              }

              @Synchronized
              fun load(ctx: Context, sinceMs: Long): List<Sample> {
                  val f = File(ctx.filesDir, FILE)
                  if (!f.exists()) return emptyList()
                  val out = ArrayList<Sample>()
                  f.forEachLine { line ->
                      val p = line.split(',')
                      if (p.size >= 6) {
                          val t = p[0].toLongOrNull() ?: return@forEachLine
                          if (t < sinceMs) return@forEachLine
                          out.add(
                              Sample(
                                  t, p[1].toFloatOrNull() ?: 0f, p[2] == "1", p[3] == "1",
                                  p[4].toFloatOrNull() ?: 0f, p[5].toIntOrNull() ?: 0
                              )
                          )
                      }
                  }
                  out.sortBy { it.t }
                  return out
              }

              @Synchronized
              fun clear(ctx: Context) {
                  File(ctx.filesDir, FILE).delete()
                  ctx.getSharedPreferences("hist", Context.MODE_PRIVATE).edit().clear().apply()
              }
          }

          object Sampler {
              private const val JOB_ID = 4711

              fun record(ctx: Context) {
                  val b = Battery.read(ctx)
                  History.add(ctx, Sample(b.time, b.pct, b.charging, Battery.isScreenOn(ctx), b.tempC, b.currentMa))
              }

              fun schedule(ctx: Context) {
                  val js = ctx.getSystemService(JobScheduler::class.java) ?: return
                  if (js.getPendingJob(JOB_ID) != null) return
                  val job = JobInfo.Builder(JOB_ID, ComponentName(ctx, SamplerJob::class.java))
                      .setPeriodic(15 * 60_000L)
                      .setPersisted(true)
                      .build()
                  try { js.schedule(job) } catch (e: Throwable) { e.printStackTrace() }
              }
          }

          class SamplerJob : JobService() {
              override fun onStartJob(params: JobParameters?): Boolean {
                  Thread {
                      try { Sampler.record(applicationContext) } catch (e: Throwable) { e.printStackTrace() }
                      jobFinished(params, false)
                  }.start()
                  return true
              }

              override fun onStopJob(params: JobParameters?): Boolean = false
          }

          class PowerReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val pr = goAsync()
                  Thread {
                      try { Sampler.record(context.applicationContext) } catch (e: Throwable) { e.printStackTrace() }
                      pr.finish()
                  }.start()
              }
          }

          class DrainStats(
              val idleRate: Float?,   // %/h with screen off
              val activeRate: Float?, // %/h with screen on
              val overallRate: Float?,
              val idleHours: Float,
              val activeHours: Float,
              val totalDrop: Float
          )

          object Analysis {
              private fun valid(a: Sample, b: Sample): Float? {
                  val h = (b.t - a.t) / 3_600_000f
                  if (h < 0.03f || h > 8f) return null
                  if (a.charging || b.charging) return null
                  if (b.pct - a.pct > 0.5f) return null // was charged in between
                  return h
              }

              fun drain(s: List<Sample>): DrainStats {
                  var idleDrop = 0f; var idleH = 0f; var actDrop = 0f; var actH = 0f
                  for (k in 1 until s.size) {
                      val a = s[k - 1]; val b = s[k]
                      val h = valid(a, b) ?: continue
                      val drop = max(0f, a.pct - b.pct)
                      if (!a.screenOn && !b.screenOn) { idleDrop += drop; idleH += h } else { actDrop += drop; actH += h }
                  }
                  val idle = if (idleH >= 0.5f) idleDrop / idleH else null
                  val act = if (actH >= 0.25f) actDrop / actH else null
                  val totH = idleH + actH
                  val all = if (totH >= 0.5f) (idleDrop + actDrop) / totH else null
                  return DrainStats(idle, act, all, idleH, actH, idleDrop + actDrop)
              }

              /** Battery drop (%) per clock hour for the last 24 hours. */
              fun hourly(s: List<Sample>, now: Long): Pair<List<String>, List<Float>> {
                  val cal = Calendar.getInstance().apply {
                      timeInMillis = now
                      set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                  }
                  val endHour = cal.timeInMillis + 3_600_000L
                  val startHour = endHour - 24 * 3_600_000L
                  val vals = FloatArray(24)
                  for (k in 1 until s.size) {
                      val a = s[k - 1]; val b = s[k]
                      valid(a, b) ?: continue
                      val drop = max(0f, a.pct - b.pct)
                      val mid = (a.t + b.t) / 2
                      val idx = ((mid - startHour) / 3_600_000L).toInt()
                      if (idx in 0..23) vals[idx] += drop
                  }
                  val labels = (0 until 24).map { fmtTime(startHour + it * 3_600_000L, "HH") }
                  return labels to vals.toList()
              }

              /** Estimated hours left on battery. */
              fun hoursLeft(b: BatterySnap, d: DrainStats): Float? {
                  if (b.charging) return null
                  val r = d.overallRate
                  if (r != null && r > 0.05f) return b.pct / r
                  if (b.chargeMah > 0 && abs(b.currentMa) > 20) return b.chargeMah.toFloat() / abs(b.currentMa)
                  return null
              }

              fun idleVerdict(rate: Float?): Pair<String, Int> = when {
                  rate == null -> "Сбор данных…" to C.SUB
                  rate < 0.6f -> "Отлично" to C.MINT
                  rate < 1.2f -> "Нормально" to C.CYAN
                  rate < 2.0f -> "Повышенный" to C.AMBER
                  else -> "Сильный разряд" to C.RED
              }
          }
