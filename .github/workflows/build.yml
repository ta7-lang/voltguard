          package com.voltguard.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.WindowInsets
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          abstract class Screen(val a: MainActivity) {
              val view: View by lazy { build() }
              protected abstract fun build(): View
              open fun onShow() {}
              open fun onHide() {}

              /** Standard scrollable page with a title. Returns (scroll view, content column). */
              protected fun page(title: String, subtitle: String): Pair<ScrollView, LinearLayout> {
                  val sv = ScrollView(a).apply { isFillViewport = true; isVerticalScrollBarEnabled = false }
                  val col = a.vbox().apply { setPadding(a.dp(16), a.dp(12), a.dp(16), a.dp(24)) }
                  col.add(a.text(title, 28f, C.TEXT, true).apply { typeface = BLACK })
                  col.add(a.text(subtitle, 13f, C.SUB), top = 2, bottom = 6)
                  sv.addView(col)
                  return sv to col
              }
          }

          class MainActivity : Activity() {
              private lateinit var content: FrameLayout
              private val screens = ArrayList<Screen>()
              private val tabs = ArrayList<Pair<TextView, TextView>>()
              private var current = -1
              val handler = Handler(Looper.getMainLooper())

              lateinit var apps: AppsScreen

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = vbox().apply { setBackgroundColor(C.BG) }
                  content = FrameLayout(this)
                  root.add(content, MATCH, 0, 1f)
                  val nav = hbox().apply {
                      setBackgroundColor(C.NAV)
                      setPadding(dp(4), dp(6), dp(4), dp(6))
                  }
                  root.add(nav)
                  root.setOnApplyWindowInsetsListener { v, insets ->
                      val bars = insets.getInsets(WindowInsets.Type.systemBars())
                      v.setPadding(bars.left, bars.top, bars.right, 0)
                      nav.setPadding(dp(4), dp(6), dp(4), dp(6) + bars.bottom)
                      insets
                  }
                  setContentView(root)

                  apps = AppsScreen(this)
                  screens += OverviewScreen(this)
                  screens += BatteryScreen(this)
                  screens += SaverScreen(this)
                  screens += CleanerScreen(this)
                  screens += apps

                  val items = listOf("◉" to "Обзор", "ϟ" to "Батарея", "❖" to "Экономия", "✦" to "Очистка", "▦" to "Приложения")
                  items.forEachIndexed { i, (icon, label) ->
                      val cell = vbox().apply {
                          gravity = Gravity.CENTER
                          setPadding(0, dp(4), 0, dp(4))
                          setOnClickListener { select(i) }
                      }
                      val ic = cell.add(text(icon, 18f, C.SUB, true).apply { gravity = Gravity.CENTER }, WRAP, WRAP)
                      val tx = cell.add(text(label, 10.5f, C.SUB, true).apply { gravity = Gravity.CENTER; maxLines = 1 }, WRAP, WRAP)
                      nav.add(cell, 0, WRAP, 1f)
                      tabs += ic to tx
                  }

                  Sampler.schedule(this)
                  bgRun { Sampler.record(applicationContext) }
                  select(0)
              }

              fun select(i: Int) {
                  if (i == current) { screens[i].onShow(); return }
                  if (current >= 0) screens[current].onHide()
                  current = i
                  content.removeAllViews()
                  val v = screens[i].view
                  (v.parent as? FrameLayout)?.removeView(v)
                  content.addView(v, FrameLayout.LayoutParams(MATCH, MATCH))
                  tabs.forEachIndexed { k, (ic, tx) ->
                      val col = if (k == i) C.MINT else C.SUB
                      ic.setTextColor(col); tx.setTextColor(col)
                  }
                  screens[i].onShow()
              }

              fun refresh() {
                  if (current >= 0) screens[current].onShow()
              }

              fun showApps(filter: Int) {
                  apps.filter = filter
